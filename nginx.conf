server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Los assets de Vite llevan hash en el nombre, se pueden cachear para siempre.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Proxy hacia el backend. Mantiene un solo origen para el navegador,
    # asi el SPA no necesita configuracion de CORS.
    location /api/ {
        # Sin la barra final se conserva /api, que es el prefijo global de Nest.
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fallback del SPA: cualquier ruta desconocida devuelve index.html
    # para que el enrutador del cliente la resuelva en vez de dar 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
